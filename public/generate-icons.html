<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Генератор иконок</title>
</head>
<body>
  <h1>Генератор PNG иконок из SVG</h1>
  <p>Откройте эту страницу в браузере и скачайте иконки нужных размеров</p>
  
  <canvas id="canvas" width="512" height="512" style="border: 1px solid #ccc;"></canvas>
  <br><br>
  
  <button onclick="generateIcon(192)">Скачать 192x192</button>
  <button onclick="generateIcon(512)">Скачать 512x512</button>
  <button onclick="generateIcon(180)">Скачать 180x180 (Apple)</button>
  
  <script>
    const svg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
      <defs>
        <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" style="stop-color:#1e293b"/>
          <stop offset="100%" style="stop-color:#0f172a"/>
        </linearGradient>
        <radialGradient id="glow" cx="50%" cy="50%" r="50%">
          <stop offset="0%" style="stop-color:#3b82f6;stop-opacity:0.3"/>
          <stop offset="100%" style="stop-color:#3b82f6;stop-opacity:0"/>
        </radialGradient>
      </defs>
      <rect width="512" height="512" rx="96" fill="url(#bg)"/>
      <circle cx="256" cy="256" r="200" fill="url(#glow)"/>
      <circle cx="256" cy="276" r="110" fill="#1f2937" stroke="#475569" stroke-width="4"/>
      <circle cx="256" cy="276" r="110" fill="none" stroke="#64748b" stroke-width="2" opacity="0.5"/>
      <ellipse cx="220" cy="240" rx="35" ry="25" fill="#475569" opacity="0.6"/>
      <g fill="#374151" stroke="#64748b" stroke-width="3">
        <rect x="248" y="130" width="16" height="50" rx="8"/>
        <rect x="248" y="382" width="16" height="50" rx="8"/>
        <rect x="110" y="268" width="50" height="16" rx="8"/>
        <rect x="352" y="268" width="50" height="16" rx="8"/>
        <rect x="150" y="170" width="16" height="50" rx="8" transform="rotate(-45 158 195)"/>
        <rect x="346" y="170" width="16" height="50" rx="8" transform="rotate(45 354 195)"/>
        <rect x="150" y="342" width="16" height="50" rx="8" transform="rotate(45 158 367)"/>
        <rect x="346" y="342" width="16" height="50" rx="8" transform="rotate(-45 354 367)"/>
      </g>
      <g transform="translate(256 80)">
        <rect x="-3" y="0" width="6" height="100" fill="#dc2626" rx="2"/>
        <path d="M 3 5 L 60 25 L 3 45 Z" fill="#ef4444" stroke="#b91c1c" stroke-width="2"/>
        <path d="M 3 5 L 60 25 L 3 25 Z" fill="#f87171" opacity="0.5"/>
      </g>
    </svg>`;

    function generateIcon(size) {
      const canvas = document.getElementById('canvas');
      const ctx = canvas.getContext('2d');
      
      canvas.width = size;
      canvas.height = size;
      
      const img = new Image();
      const blob = new Blob([svg], {type: 'image/svg+xml'});
      const url = URL.createObjectURL(blob);
      
      img.onload = function() {
        ctx.drawImage(img, 0, 0, size, size);
        URL.revokeObjectURL(url);
        
        canvas.toBlob(function(blob) {
          const link = document.createElement('a');
          link.download = `icon-${size}.png`;
          link.href = URL.createObjectURL(blob);
          link.click();
        }, 'image/png');
      };
      
      img.src = url;
    }
    
    // Initial render
    window.onload = () => generateIcon(512);
  </script>
</body>
</html>
